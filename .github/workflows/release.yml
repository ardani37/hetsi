# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install pyinstaller customtkinter
      - name: Construire l'exe
        run: python -m PyInstaller --onefile --windowed --name hetsi --icon hetsi/assets/hetsi.ico --add-data "hetsi/assets/hetsi.ico;hetsi/assets" --collect-all customtkinter main.py
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hetsi.exe
